<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/static/icons/favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Estudantina">
<meta name="theme-color" content="#F7FAFC">
<title>Estudantina · Events</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css?v={{ v }}">
<style>
.toolbar { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:20px; }
.month-nav { display:flex; align-items:center; gap:6px; }
.month-nav button { width:32px; height:32px; border-radius:8px; border:1px solid var(--border);
  background:var(--bg-card); color:var(--text); cursor:pointer; font-size:15px; display:flex; align-items:center; justify-content:center; }
.month-nav button:hover { background:var(--bg-hover); }
.month-title { font-size:17px; font-weight:600; min-width:150px; text-transform:capitalize; }
.seg { display:inline-flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
.seg button { padding:7px 14px; font-size:12.5px; font-weight:500; border:none; background:var(--bg-card);
  color:var(--muted); cursor:pointer; }
.seg button.on { background:var(--spec); color:#fff; }
.btn-primary { font-family:inherit; font-size:12.5px; font-weight:600; padding:9px 16px; border-radius:8px;
  cursor:pointer; border:none; background:var(--spec); color:#fff; margin-left:auto; }
.btn-primary:hover { filter:brightness(1.06); }
.today-btn { padding:7px 12px; font-size:12.5px; border:1px solid var(--border); border-radius:8px;
  background:var(--bg-card); color:var(--text); cursor:pointer; }
.today-btn:hover { background:var(--bg-hover); }

/* ── Calendrier ── */
.cal { border:1px solid var(--border); border-radius: 4px; overflow:hidden; background:var(--bg-card); }
.cal-head { display:grid; grid-template-columns:repeat(7,1fr); background:var(--bg-hover); }
.cal-head div { padding:9px 10px; font-family:var(--mono); font-size:10px; font-weight:600; letter-spacing:.08em;
  text-transform:uppercase; color:var(--muted); text-align:left; }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); }
.cal-cell { min-height:104px; border-top:1px solid var(--border); border-left:1px solid var(--border); padding:6px;
  cursor:pointer; position:relative; }
.cal-cell:nth-child(7n+1){ border-left:none; }
.cal-cell:hover { background:var(--bg-hover); }
.cal-cell.other { background:var(--bg-page); }
.cal-cell.other .cal-daynum { color:var(--faint); }
.cal-daynum { font-size:12.5px; font-weight:600; color:var(--text); margin-bottom:4px; display:inline-flex;
  align-items:center; justify-content:center; width:22px; height:22px; border-radius:50%; }
.cal-cell.today .cal-daynum { background:var(--spec); color:#fff; }
.ev-chip { display:flex; align-items:center; gap:5px; padding:2px 6px; border-radius:5px; font-size:11px;
  font-weight:500; margin-bottom:3px; background:var(--bg-hover); color:var(--text); overflow:hidden;
  white-space:nowrap; text-overflow:ellipsis; }
.ev-chip .dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
.ev-chip.cancelled { text-decoration:line-through; opacity:.5; }
.ev-chip .tt { overflow:hidden; text-overflow:ellipsis; }
@media (max-width:760px){ .cal-cell { min-height:74px; } .ev-chip .tt { display:none; } .ev-chip { display:inline-flex; margin-right:3px; } }

/* ── Liste ── */
.ev-list { display:flex; flex-direction:column; gap:10px; }
.ev-card { border:1px solid var(--border); border-radius: 4px; padding:14px 16px; background:var(--bg-card);
  cursor:pointer; display:flex; gap:12px; align-items:flex-start; }
.ev-card:hover { background:var(--bg-hover); }
.ev-card .cbar { width:4px; align-self:stretch; border-radius:3px; }
.ev-card h3 { font-size:14.5px; font-weight:600; margin:0 0 3px; }
.ev-card .meta { font-size:12px; color:var(--muted); }
.list-group-label { font-family:var(--mono); font-size:10px; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
  color:var(--muted); margin:18px 0 8px; }

.badge { font-size:10px; font-weight:600; padding:2px 9px; border-radius:20px; white-space:nowrap; }
.b-planned { background:var(--bg-hover); color:var(--muted); }
.b-confirmed { background:var(--spec-soft); color:var(--spec); }
.b-done { background:var(--green-soft); color:var(--green); }
.b-cancelled { background:var(--red-soft); color:var(--red); }

/* ── Voile de la fenêtre ── */
.overlay { position:fixed; inset:0; background:rgba(20,18,14,.34); z-index:100; opacity:0; pointer-events:none;
  transition:opacity .18s; }
.overlay.show { opacity:1; pointer-events:auto; }
/* ⚠️ 102, AU-DESSUS DU TIROIR (101). Les deux étaient à 101 : à égalité de z-index, c'est
   l'ordre du DOM qui tranche, et le tiroir est déclaré après le modal. Il passait donc
   par-dessus. Sur téléphone le tiroir fait 96vw : le modal d'édition s'ouvrait intégralement
   derrière lui et le bouton « Éditer » semblait ne rien faire. Le handler ferme désormais le
   tiroir avant d'ouvrir le modal ; cet écart de z-index est la ceinture. */
.modal { position:fixed; z-index:102; top:50%; left:50%; transform:translate(-50%,-48%); width:min(520px,94vw);
  max-height:90vh; overflow:auto; background:var(--bg-card); border:1px solid var(--border); border-radius:14px;
  padding:22px 24px; opacity:0; pointer-events:none; transition:all .18s; }
.modal.show { opacity:1; pointer-events:auto; transform:translate(-50%,-50%); }
/* ⚠️ LE TIROIR EST PARTI, SON STYLE AVEC. Laisser une règle pour un élément qui n'existe plus,
   c'est laisser croire à la couche suivante qu'elle peut revenir — et c'est la superposition des
   deux couches qui a produit les pannes dont ce fichier garde l'historique. */

.modal h2 { font-size:17px; font-weight:600; margin:0 0 16px; }
.f-row { margin-bottom:13px; }
.f-row2 { display:flex; gap:10px; }
.f-row2 > div { flex:1; }
.field-label { font-size:11px; font-weight:500; color:var(--muted); margin-bottom:5px; display:block; }
.field-input, .field-area, select.field-input { width:100%; font-family:inherit; font-size:13px; padding:8px 10px;
  border:1px solid var(--border); border-radius:7px; background:var(--bg-page); color:var(--text); box-sizing:border-box; }
.field-area { resize:vertical; min-height:66px; }
.ordinals { display:flex; gap:8px 14px; flex-wrap:wrap; }
.ordinals label { display:flex; align-items:center; gap:5px; font-size:12.5px; color:var(--text); cursor:pointer; }
.ordinals input { width:15px; height:15px; accent-color:var(--spec); }
.swatches { display:flex; gap:8px; }
.swatch { width:24px; height:24px; border-radius:50%; cursor:pointer; border:2px solid transparent; }
.swatch.on { border-color:var(--text); }
.modal-actions { display:flex; gap:10px; justify-content:space-between; align-items:center; margin-top:20px; }
.btn { font-family:inherit; font-size:12.5px; font-weight:500; padding:9px 16px; border-radius:8px; cursor:pointer;
  border:1px solid var(--border); background:var(--bg-card); color:var(--text); }
.btn:hover { background:var(--bg-hover); }
.btn-danger { color:var(--red); border-color:transparent; background:transparent; }
.btn-danger:hover { background:var(--red-soft); }

/* ── Drawer sections ── */
.dr-meta { font-size:12.5px; color:var(--muted); margin-bottom:6px; }
.dr-sec { margin-top:22px; }
.dr-sec-h { font-family:var(--mono); font-size:10px; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
  color:var(--muted); margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; }
.task { display:flex; align-items:center; gap:9px; padding:7px 0; border-bottom:1px solid var(--border); }
.task:last-child { border-bottom:none; }
.task input[type=checkbox]{ width:16px; height:16px; accent-color:var(--spec); cursor:pointer; flex-shrink:0; }
.task .tlabel { flex:1; font-size:13px; }
.task.done .tlabel { text-decoration:line-through; color:var(--faint); }
.task .tdel { color:var(--faint); cursor:pointer; font-size:15px; border:none; background:none; }
.task .tdel:hover { color:var(--red); }
.addrow { display:flex; gap:8px; margin-top:9px; }
.addrow input { flex:1; font-family:inherit; font-size:12.5px; padding:7px 9px; border:1px solid var(--border);
  border-radius:7px; background:var(--bg-page); color:var(--text); }
.addrow button { padding:7px 12px; border-radius:7px; border:none; background:var(--spec); color:#fff; cursor:pointer; font-size:13px; }
.note { padding:9px 11px; background:var(--bg-hover); border-radius: 4px; margin-bottom:8px; }
.note .ntext { font-size:13px; white-space:pre-wrap; }
.note .nts { font-family:var(--mono); font-size:9.5px; color:var(--faint); margin-top:4px; letter-spacing:.04em; }
.empty-mini { font-size:12.5px; color:var(--faint); padding:6px 0; }
.progress { font-family:var(--mono); font-size:11px; color:var(--muted); }

.toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(80px); background:var(--text);
  color:var(--bg-card); padding:10px 18px; border-radius:8px; font-size:13px; opacity:0; transition:all .25s; z-index:200; }
.toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
</style>
</head>
<body>
{% include "_rail.html" %}
<div class="page">

  <div class="header">
    <div>
      <div class="header-title">Events</div>
      <div class="header-sub">Pop-ups & événements — calendrier, tâches, notes</div>
    </div>
  </div>

  <div class="toolbar">
    <div class="month-nav">
      <button id="prev" aria-label="Mois précédent">‹</button>
      <div class="month-title" id="month-title">—</div>
      <button id="next" aria-label="Mois suivant">›</button>
    </div>
    <button class="today-btn" id="today-btn">Aujourd'hui</button>
    <div class="seg">
      <button id="v-cal" class="on">Calendrier</button>
      <button id="v-list">Liste</button>
    </div>
    <button class="btn-primary" id="new-btn">+ Nouvel event</button>
  </div>

  <div id="cal-wrap" class="cal">
    <div class="cal-head" id="cal-head"></div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>

  <div id="list-wrap" class="ev-list" style="display:none;"></div>

</div><!-- /page -->

<!-- Overlay + Modal création/édition -->
<div class="overlay" id="overlay"></div>
<div class="modal" id="modal">
  <h2 id="modal-title">Nouvel event</h2>
  <input type="hidden" id="m-id">
  <div class="f-row">
    <label class="field-label">Titre</label>
    <input class="field-input" id="m-title" placeholder="Ex. Pop-up torréfacteur invité">
  </div>
  <div class="f-row f-row2">
    <div><label class="field-label">Date</label><input type="date" class="field-input" id="m-date"></div>
    <div><label class="field-label">Fin (si plusieurs jours)</label><input type="date" class="field-input" id="m-end"></div>
  </div>
  <div class="f-row f-row2">
    <div><label class="field-label">Heure début</label><input type="time" class="field-input" id="m-start"></div>
    <div><label class="field-label">Heure fin</label><input type="time" class="field-input" id="m-endtime"></div>
  </div>
  <div class="f-row f-row2">
    <div><label class="field-label">Lieu</label><input class="field-input" id="m-loc" placeholder="Café, terrasse…"></div>
    <div><label class="field-label">Statut</label>
      <select class="field-input" id="m-status">
        <option value="planned">Prévu</option>
        <option value="confirmed">Confirmé</option>
        <option value="done">Terminé</option>
        <option value="cancelled">Annulé</option>
      </select>
    </div>
  </div>
  <div class="f-row">
    <label class="field-label">Couleur</label>
    <div class="swatches" id="m-swatches"></div>
  </div>
  <div class="f-row">
    <label class="field-label">Description</label>
    <textarea class="field-area" id="m-desc" placeholder="De quoi il s'agit, invités, format…"></textarea>
  </div>
  <!-- ⚠️ TROIS RANGÉES DE PLUS DANS UNE FENÊTRE DÉJÀ À `max-height: 90vh`, et c'est une
       régression que j'ai causée : le formulaire comptait douze rangées, j'en ai ajouté trois —
       25 % de hauteur en plus. Sur un écran d'iPad en paysage, la fenêtre se met à défiler et le
       bouton « Enregistrer » sort du champ de vision. Elles rentrent donc dans un pli.

       ⚠️ UN `<details>` NATIF, fermé par défaut : ce sont des champs qu'on remplit une fois par
       événement, pas à chaque correction d'horaire. Et il n'a besoin d'aucun JavaScript — sur une
       page dont le JavaScript est justement suspect, c'est ce qui compte. -->
  <details class="f-row" style="display:block">
    <summary style="cursor:pointer;padding:8px 0;font-size:.9rem;opacity:.85">
      Page client — affiche, lien, visibilité
    </summary>
  <div class="f-row">
    <label class="field-label">Affiche <span style="opacity:.6">(page client)</span></label>
    <div>
      <input class="field-input" id="m-img" placeholder="https://… ou envoyer un fichier">
      <div style="display:flex;align-items:center;gap:.5rem;margin-top:.4rem">
        <input type="file" id="m-img-file" accept="image/jpeg,image/png,image/webp">
        <span id="m-img-etat" style="font-size:.85rem;opacity:.7"></span>
      </div>
      <!-- L'aperçu évite d'enregistrer une URL qui ne mène à rien : on le voit avant de valider. -->
      <img id="m-img-vue" alt="" style="display:none;margin-top:.5rem;max-height:120px;border-radius:8px">
    </div>
  </div>
  <div class="f-row">
    <label class="field-label">Lien <span style="opacity:.6">(page client)</span></label>
    <div style="display:flex;gap:.5rem">
      <input class="field-input" id="m-link" placeholder="https://… (billetterie, inscription)">
      <input class="field-input" id="m-link-label" placeholder="Texte du bouton" style="max-width:11rem">
    </div>
  </div>
  <div class="f-row">
    <label class="field-label">Sur la page client</label>
    <label style="display:flex;align-items:center;gap:.5rem;font-size:.9rem">
      <input type="checkbox" id="m-oncard" checked>
      <!-- ⚠️ DÉCOCHÉ POUR CE QUI EST INTERNE. Le calendrier porte aussi des privatisations et des
           rendez-vous fournisseurs : « Privatisation anniversaire Marta » sur la page de tous les
           clients est le genre de fuite que personne ne découvre avant qu'un client n'en parle. -->
      <span>Afficher cet événement aux clients</span>
    </label>
  </div>
  </details>
  <div class="f-row" id="m-recur-wrap">
    <label class="field-label">Répétition</label>
    <select class="field-input" id="m-recur">
      <option value="none">Aucune (une seule fois)</option>
      <option value="weekly">Chaque semaine</option>
      <option value="biweekly">Toutes les 2 semaines</option>
      <option value="monthly_date">Chaque mois — même date</option>
      <option value="monthly_nth">Chaque mois — jour de semaine choisi</option>
    </select>
    <div id="m-nth-wrap" style="display:none; margin-top:10px;">
      <div class="field-label" id="m-nth-label">Quelles occurrences ?</div>
      <div class="ordinals">
        <label><input type="checkbox" value="1"> 1er</label>
        <label><input type="checkbox" value="2"> 2e</label>
        <label><input type="checkbox" value="3"> 3e</label>
        <label><input type="checkbox" value="4"> 4e</label>
        <label><input type="checkbox" value="last"> Dernier</label>
      </div>
    </div>
    <div id="m-horizon-wrap" style="display:none; margin-top:10px;">
      <label class="field-label">Pendant</label>
      <select class="field-input" id="m-horizon">
        <option value="3">3 mois</option>
        <option value="6">6 mois</option>
        <option value="12">12 mois</option>
      </select>
      <div id="m-recur-preview" style="font-family:var(--mono); font-size:11px; color:var(--spec); margin-top:7px;"></div>
    </div>
  </div>

  <!-- ⚠️ TÂCHES ET NOTES VIVAIENT DANS UN TIROIR SÉPARÉ, et c'est ce tiroir qui rendait un gel
       possible : cliquer un événement l'ouvrait, « Éditer » le fermait PUIS ouvrait la fenêtre.
       Entre les deux, le voile restait posé avec `pointer-events:auto` — si quoi que ce soit
       échouait, la page devenait inerte sans un mot. Une seule couche ne peut pas faire ça.

       ⚠️ ELLES NE S'AFFICHENT QUE SUR UN ÉVÉNEMENT EXISTANT. Une tâche ou une note se rattache à
       un identifiant : avant l'enregistrement, il n'y a rien à quoi les accrocher, et une zone de
       saisie qui perd ce qu'on y met est pire qu'une zone absente. -->
  <div id="m-suivi" style="display:none;">
    <div class="dr-sec">
      <div class="dr-sec-h"><span>Tâches à faire</span><span class="progress" id="d-progress"></span></div>
      <div id="d-tasks"></div>
      <div class="addrow">
        <input id="d-task-input" placeholder="Ajouter une tâche…">
        <button id="d-task-add">+</button>
      </div>
    </div>
    <div class="dr-sec">
      <div class="dr-sec-h">Notes (au fil de l'eau)</div>
      <div id="d-notes"></div>
      <div class="addrow">
        <input id="d-note-input" placeholder="Ajouter une note…">
        <button id="d-note-add">+</button>
      </div>
    </div>
  </div>
  <!-- ⚠️ LES ACTIONS COLLENT AU BAS DE LA FENÊTRE. Elle a `max-height: 90vh; overflow: auto` et
       porte maintenant le formulaire ET le suivi : sans `sticky`, « Enregistrer » descend hors du
       champ de vision dès que la liste de tâches s'allonge. On remplit un formulaire pour
       l'enregistrer ; le bouton qui le fait ne doit jamais demander à chercher. -->
  <div class="modal-actions" style="position:sticky; bottom:-22px; background:var(--bg-card); padding-bottom:22px;">
    <div style="display:flex; gap:10px;">
      <button class="btn btn-danger" id="m-delete" style="visibility:hidden;">Supprimer</button>
      <button class="btn btn-danger" id="d-delete-series" style="display:none;">Supprimer la série</button>
    </div>
    <div style="display:flex; gap:10px;">
      <button class="btn" id="m-cancel">Annuler</button>
      <button class="btn-primary" id="m-save" style="margin:0;">Enregistrer</button>
    </div>
  </div>
</div>

<!-- ⚠️ LE TIROIR DE DÉTAIL A ÉTÉ SUPPRIMÉ, ET C'EST UNE CORRECTION, PAS UN RANGEMENT.
     Deux couches superposées (tiroir z-index 101, fenêtre 102, voile 100) ont produit plusieurs
     pannes dont l'historique est écrit dans ce fichier. La dernière : cliquer un événement
     ouvrait le tiroir, « Éditer » le fermait puis ouvrait la fenêtre — et le voile, lui, restait
     posé avec `pointer-events:auto`. Un échec entre les deux rendait toute la page inerte, sans
     erreur, sans message, sans rien. « Ça se bloque juste. »

     Cliquer un événement ouvre désormais DIRECTEMENT la fenêtre d'édition, qui porte aussi les
     tâches et les notes. Une étape de moins pour l'usage courant — on clique un événement pour le
     modifier — et une classe de pannes qui n'existe plus. -->

<div class="toast" id="toast"></div>

<script src="/static/ui.js?v={{ v }}"></script>
<script>
/* ── FAIRE PARLER LES PANNES SILENCIEUSES ──────────────────────────────────────────────────
 *
 * ⚠️ SUR CETTE PAGE, UNE ERREUR JAVASCRIPT NE SE VOIT PAS : ELLE SE TRADUIT PAR « rien ne se
 * passe ». Cliquer un événement ferme le tiroir AVANT d'ouvrir la fenêtre d'édition — si
 * l'ouverture lève, le tiroir se referme et l'écran reste sur le calendrier, sans un mot. On ne
 * peut alors ni savoir quoi corriger, ni même savoir qu'il y a quelque chose à corriger.
 *
 * ⚠️ ET LE MESSAGE EST À L'ÉCRAN, PAS DANS LA CONSOLE. Le backoffice s'ouvre depuis un téléphone
 * ou un iPad aussi souvent que depuis un ordinateur ; « regarde la console » n'y veut rien dire.
 */
window.addEventListener('error', function(ev){ signalerPanne(ev.message, ev.filename, ev.lineno); });
window.addEventListener('unhandledrejection', function(ev){
  signalerPanne('Promesse rejetée : ' + ((ev.reason && ev.reason.message) || ev.reason), '', 0);
});
function signalerPanne(msg, fichier, ligne){
  var d = document.getElementById('panne');
  if(!d){
    d = document.createElement('div');
    d.id = 'panne';
    d.style.cssText = 'position:fixed;z-index:999;left:0;right:0;bottom:0;padding:12px 16px;' +
      /* ⚠️ LE JETON, PAS LA VALEUR. Un `#B42318` en dur reste rouge vif en mode sombre, où le
         rouge de la charte s'éclaircit pour rester lisible — et un bandeau d'erreur illisible est
         un bandeau qu'on ignore. `test_aucune_couleur_en_dur` l'a d'ailleurs refusé. */
      'background:var(--red);color:var(--accent-ink,#fff);font:13px/1.4 system-ui;white-space:pre-wrap';
    d.onclick = function(){ d.remove(); };
    document.body.appendChild(d);
  }
  /* Le fichier et la ligne comptent autant que le message : ils disent QUEL bout de page a cassé. */
  d.textContent = 'Erreur : ' + msg + (ligne ? ' (' + (fichier||'').split('/').pop() + ':' + ligne + ')' : '')
    + ' — toucher pour masquer';
}

/* ── L'affiche : aperçu et envoi ───────────────────────────────────────────────────────────
 *
 * ⚠️ L'APERÇU EXISTE POUR NE PAS ENREGISTRER UNE URL MORTE. Une adresse collée depuis ailleurs
 * peut être privée, expirée ou simplement fausse : on ne s'en apercevrait que sur la page d'un
 * client, sans savoir depuis quand.
 */
function majApercu(){
  const u = (document.getElementById('m-img').value || '').trim();
  const img = document.getElementById('m-img-vue');
  if(!u){ img.style.display='none'; img.removeAttribute('src'); return; }
  img.src = u; img.style.display='block';
}
async function envoyerAffiche(){
  const f = document.getElementById('m-img-file').files?.[0];
  if(!f) return;
  const etat = document.getElementById('m-img-etat');
  etat.textContent = 'Envoi…';
  const fd = new FormData();
  fd.append('file', f);
  /* L'identifiant sert de dossier : les affiches d'un même événement restent ensemble. */
  fd.append('event_id', document.getElementById('m-id').value || 'novo');
  try{
    const r = await fetch('/api/events/image', {method:'POST', body: fd});
    const j = await r.json();
    if(!j.ok) throw new Error(j.error || 'erro');
    document.getElementById('m-img').value = j.url;
    majApercu();
    /* ⚠️ L'URL EST POSÉE DANS LE CHAMP, PAS ENREGISTRÉE DIRECTEMENT. Rien n'est écrit en base
       avant que l'utilisateur ne valide le formulaire : un envoi annulé ne laisse qu'un fichier
       orphelin dans le bucket, jamais une fiche à moitié modifiée. */
    etat.textContent = 'Envoyé ✓';
  }catch(e){
    etat.textContent = 'Échec : ' + e.message;
  }
}
const COLORS = ['var(--accent)','var(--green)','var(--amber)','var(--red)','var(--cat-3)','var(--cat-2)'];
const STATUS = { planned:['Prévu','b-planned'], confirmed:['Confirmé','b-confirmed'], done:['Terminé','b-done'], cancelled:['Annulé','b-cancelled'] };
const MONTHS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const WD = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];

let events = [];            // liste brute
let tasksByEvent = {};      // id → [tasks]
let cur = new Date(); cur.setDate(1);
let view = 'cal';
let selectedId = null;

const $ = id => document.getElementById(id);
function showToast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
function ymd(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function todayStr(){ return ymd(new Date()); }
function fmtDate(s){ if(!s) return ''; const d=new Date(s+'T12:00:00'); return `${WD[(d.getDay()+6)%7]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; }

// ── Chargement ───────────────────────────────────────────────────────────────
/**
 * ⚠️ UN CHARGEMENT QUI ÉCHOUE RENDAIT UN CALENDRIER VIDE, SANS UN MOT. `events = er.ok ? … : []`
 * et le `catch` avalaient tout : une session expirée, une erreur Supabase, un 500 — dans tous les
 * cas la page s'affichait NORMALEMENT, le mois se dessinait, et il n'y avait simplement aucun
 * événement dessus. Rien à cliquer, et rien qui dise pourquoi.
 *
 * ⚠️ C'EST EXACTEMENT CE QUI SE DÉCRIT PAR « je ne peux pas cliquer sur mes événements ». Le
 * défaut n'est pas dans le clic : il est dans le silence de la lecture. Un calendrier vide parce
 * qu'il n'y a rien ce mois-ci et un calendrier vide parce que la base n'a pas répondu se
 * ressemblent trait pour trait, et se corrigent de façons opposées.
 *
 * ⚠️ ET LES TÂCHES NE DOIVENT PAS EMPORTER LES ÉVÉNEMENTS. Les deux lectures étaient liées par un
 * `Promise.all` puis par un `catch` commun : une panne sur les tâches — accessoires — vidait le
 * calendrier entier.
 */
async function loadAll(){
  if (window.uiLoadStart) uiLoadStart();
  try {
    const [er, tr] = await Promise.all([ fetch('/api/events'), fetch('/api/events/tasks') ]);
    if (er.ok) {
      events = await er.json();
    } else {
      events = [];
      signalerPanne('Les événements n\'ont pas pu être lus (HTTP ' + er.status + ')'
        + (er.status === 401 ? ' — session expirée, reconnectez-vous.' : ''), '', 0);
    }
    tasksByEvent = {};
    if (tr.ok) {
      const tasks = await tr.json();
      tasks.forEach(t => (tasksByEvent[t.event_id] = tasksByEvent[t.event_id] || []).push(t));
    } else {
      /* Accessoire : le calendrier reste utilisable sans les tâches, mais on le dit. */
      signalerPanne('Les tâches n\'ont pas pu être lues (HTTP ' + tr.status + ') — le calendrier reste utilisable.', '', 0);
    }
  } catch(e) {
    events = []; tasksByEvent = {};
    signalerPanne('Chargement impossible : ' + (e && e.message ? e.message : e), '', 0);
  } finally {
    if (window.uiLoadEnd) uiLoadEnd();
  }
  render();
}

function eventsOn(dateStr){
  return events.filter(e => {
    const end = e.end_date || e.date;
    return dateStr >= e.date && dateStr <= end;
  });
}

// ── Rendu ────────────────────────────────────────────────────────────────────
function render(){
  $('month-title').textContent = `${MONTHS[cur.getMonth()]} ${cur.getFullYear()}`;
  $('v-cal').classList.toggle('on', view==='cal');
  $('v-list').classList.toggle('on', view==='list');
  $('cal-wrap').style.display  = view==='cal' ? 'block' : 'none';
  $('list-wrap').style.display = view==='list' ? 'flex' : 'none';
  view==='cal' ? renderCalendar() : renderList();
}

function renderCalendar(){
  $('cal-head').innerHTML = WD.map(d=>`<div>${d}</div>`).join('');
  const y=cur.getFullYear(), m=cur.getMonth();
  const first=new Date(y,m,1);
  const startOffset=(first.getDay()+6)%7;           // lundi = 0
  const start=new Date(y,m,1-startOffset);
  const today=todayStr();
  let html='';
  for(let i=0;i<42;i++){
    const d=new Date(start); d.setDate(start.getDate()+i);
    const ds=ymd(d);
    const other = d.getMonth()!==m;
    const evs=eventsOn(ds);
    const chips=evs.slice(0,3).map(e=>{
      const cls = e.status==='cancelled' ? 'ev-chip cancelled' : 'ev-chip';
      return `<div class="${cls}" data-ev="${e.id}"><span class="dot" style="background:${e.color||'var(--accent)'}"></span><span class="tt">${esc(e.title)}</span></div>`;
    }).join('');
    const more = evs.length>3 ? `<div style="font-size:10px;color:var(--muted);padding-left:2px;">+${evs.length-3}</div>` : '';
    html += `<div class="cal-cell${other?' other':''}${ds===today?' today':''}" data-day="${ds}">
      <span class="cal-daynum">${d.getDate()}</span>${chips}${more}</div>`;
  }
  $('cal-grid').innerHTML=html;
}

function renderList(){
  const wrap=$('list-wrap');
  if(!events.length){ wrap.innerHTML='<div class="empty-mini" style="padding:30px;text-align:center;">Aucun event. Clique « + Nouvel event ».</div>'; return; }
  const today=todayStr();
  const sorted=[...events].sort((a,b)=>a.date.localeCompare(b.date));
  const up=sorted.filter(e=>(e.end_date||e.date)>=today);
  const past=sorted.filter(e=>(e.end_date||e.date)<today).reverse();
  const card=e=>{
    const [lbl,cls]=STATUS[e.status]||STATUS.planned;
    const t=tasksByEvent[e.id]||[]; const done=t.filter(x=>x.done).length;
    const time=e.start_time?` · ${e.start_time}${e.end_time?'–'+e.end_time:''}`:'';
    const loc=e.location?` · ${esc(e.location)}`:'';
    const tp=t.length?` · ✓ ${done}/${t.length}`:'';
    return `<div class="ev-card" data-ev="${e.id}">
      <div class="cbar" style="background:${e.color||'var(--accent)'}"></div>
      <div style="flex:1;">
        <h3>${esc(e.title)} <span class="badge ${cls}">${lbl}</span></h3>
        <div class="meta">${fmtDate(e.date)}${e.end_date&&e.end_date!==e.date?' → '+fmtDate(e.end_date):''}${time}${loc}${tp}</div>
      </div></div>`;
  };
  wrap.innerHTML =
    (up.length?`<div class="list-group-label">À venir</div>`+up.map(card).join(''):'') +
    (past.length?`<div class="list-group-label">Passés</div>`+past.map(card).join(''):'');
}

function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ── Modal création / édition ─────────────────────────────────────────────────
let modalColor = COLORS[0];
function buildSwatches(){
  $('m-swatches').innerHTML = COLORS.map(c=>`<div class="swatch${c===modalColor?' on':''}" data-c="${c}" style="background:${c}"></div>`).join('');
}
function openModal(ev, prefillDate){
  const isEdit=!!ev;
  $('modal-title').textContent = isEdit?'Éditer l\'event':'Nouvel event';
  $('m-id').value      = ev?.id || '';
  $('m-title').value   = ev?.title || '';
  $('m-date').value    = ev?.date || prefillDate || todayStr();
  $('m-end').value     = ev?.end_date || '';
  $('m-start').value   = ev?.start_time || '';
  $('m-endtime').value = ev?.end_time || '';
  $('m-loc').value     = ev?.location || '';
  $('m-status').value  = ev?.status || 'planned';
  $('m-desc').value    = ev?.description || '';
  $('m-img').value     = ev?.image_url || '';
  $('m-link').value    = ev?.link_url || '';
  $('m-link-label').value = ev?.link_label || '';
  // ⚠️ `!== false` ET NON `|| true` : un événement d'avant la colonne rend `undefined`, et c'est
  // « affiché » par défaut — ce qui est le comportement qu'on avait déjà.
  $('m-oncard').checked = ev?.show_on_card !== false;
  $('m-img-etat').textContent = '';
  majApercu();
  /* ⚠️ BRANCHÉ ICI, PAS AU CHARGEMENT DE LA PAGE. Le formulaire est (ré)initialisé à chaque
     ouverture de la fenêtre ; poser les écouteurs une seule fois au démarrage marcherait, mais
     `onchange` posé en propriété — et non en `addEventListener` — reste idempotent, ce qui évite
     un envoi en double après plusieurs ouvertures. */
  $('m-img-file').onchange = envoyerAffiche;
  $('m-img').oninput = majApercu;
  modalColor = ev?.color || COLORS[0];
  buildSwatches();
  $('m-delete').style.visibility = isEdit?'visible':'hidden';
  // Récurrence : proposée uniquement à la création (pas en édition)
  $('m-recur-wrap').style.display = isEdit ? 'none' : 'block';
  if(!isEdit){
    $('m-recur').value='none';
    document.querySelectorAll('#m-nth-wrap input:checked').forEach(c=>c.checked=false);
    currentRecurState(); updateRecurPreview();
  }
  /**
   * ⚠️ LE SUIVI N'EXISTE QUE POUR UN ÉVÉNEMENT DÉJÀ ENREGISTRÉ. Une tâche ou une note se rattache
   * à un identifiant : avant l'enregistrement il n'y a rien à quoi les accrocher, et une zone de
   * saisie qui perd ce qu'on y met est pire qu'une zone absente.
   */
  $('m-suivi').style.display = isEdit ? 'block' : 'none';
  if (isEdit) {
    renderTasks(ev); renderNotes(ev);
    const seriesCount = ev.series_id ? events.filter(x=>x.series_id===ev.series_id).length : 0;
    $('d-delete-series').style.display = seriesCount>1 ? 'inline-block' : 'none';
    $('d-delete-series').textContent = `Supprimer la série (${seriesCount})`;
  } else {
    $('d-delete-series').style.display = 'none';
  }
  /**
   * ⚠️ `selectedId` SUIT L'ÉVÉNEMENT OUVERT, et il servait au tiroir. Les tâches et les notes
   * s'écrivent encore contre lui : le vider ici aurait fait échouer l'ajout d'une tâche sans
   * qu'aucun message ne le dise.
   */
  selectedId = isEdit ? ev.id : null;
  overlayOn(); $('modal').classList.add('show');
}
function closeModal(){ $('modal').classList.remove('show'); overlayOff(); }

// ── Récurrence : génère la liste des dates d'occurrences ─────────────────────
const WD_FULL=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
function nthWeekdayOfMonth(y,mo,wd,nth){
  if(nth==='last'){
    const last=new Date(y,mo+1,0); let d=last.getDate();
    while(new Date(y,mo,d).getDay()!==wd) d--;
    return new Date(y,mo,d);
  }
  let c=0;
  for(let d=1; d<=31; d++){
    const dt=new Date(y,mo,d);
    if(dt.getMonth()!==mo) break;
    if(dt.getDay()===wd){ if(++c===nth) return dt; }
  }
  return null;
}
function selectedOrdinals(){
  return [...document.querySelectorAll('#m-nth-wrap input:checked')]
    .map(c=>c.value==='last'?'last':parseInt(c.value));
}
function computeOccurrences(startStr, rule, ordinals, horizonMonths){
  if(!startStr) return [];
  const start=new Date(startStr+'T12:00:00');
  const end=new Date(start); end.setMonth(end.getMonth()+horizonMonths);
  const out=[];
  if(rule==='weekly'||rule==='biweekly'){
    const step=rule==='weekly'?7:14; let d=new Date(start);
    while(d<=end && out.length<400){ out.push(ymd(d)); d.setDate(d.getDate()+step); }
  } else if(rule==='monthly_date'){
    const day=start.getDate(); let m=new Date(start.getFullYear(),start.getMonth(),1);
    while(m<=end){
      const dt=new Date(m.getFullYear(),m.getMonth(),day);
      if(dt.getMonth()===m.getMonth() && dt>=start && dt<=end) out.push(ymd(dt));
      m.setMonth(m.getMonth()+1);
    }
  } else if(rule==='monthly_nth'){
    const wd=start.getDay(); let m=new Date(start.getFullYear(),start.getMonth(),1);
    while(m<=end){
      ordinals.forEach(nth=>{
        const dt=nthWeekdayOfMonth(m.getFullYear(),m.getMonth(),wd,nth);
        if(dt && dt>=start && dt<=end) out.push(ymd(dt));
      });
      m.setMonth(m.getMonth()+1);
    }
  }
  return [...new Set(out)].sort();
}
function currentRecurState(){
  const rule=$('m-recur').value;
  const isNth=rule==='monthly_nth';
  $('m-nth-wrap').style.display = isNth ? 'block' : 'none';
  $('m-horizon-wrap').style.display = rule==='none' ? 'none' : 'block';
  if(isNth){
    const wd=new Date(($('m-date').value||todayStr())+'T12:00:00').getDay();
    $('m-nth-label').textContent = `Quels ${WD_FULL[wd]}s ?`;
  }
  return rule;
}
function updateRecurPreview(){
  const rule=$('m-recur').value;
  if(rule==='none'){ $('m-recur-preview').textContent=''; return; }
  const dates=computeOccurrences($('m-date').value, rule, selectedOrdinals(), parseInt($('m-horizon').value));
  $('m-recur-preview').textContent = dates.length
    ? `${dates.length} dates · ${dates[0]} → ${dates[dates.length-1]}`
    : 'aucune date (coche au moins une occurrence)';
}

let saving=false;   // verrou anti-double-soumission
async function saveEvent(){
  if(saving) return;                                  // ignore les clics répétés
  const title=$('m-title').value.trim();
  if(!title){ showToast('Titre requis'); return; }
  const id=$('m-id').value;
  const rule = id ? 'none' : $('m-recur').value;      // récurrence uniquement à la création
  const endDate = $('m-end').value || null;
  const base={
    title,
    start_time: $('m-start').value || null,
    end_time: $('m-endtime').value || null,
    location: $('m-loc').value.trim(),
    status: $('m-status').value,
    color: modalColor,
    description: $('m-desc').value.trim(),
    image_url: $('m-img').value.trim(),
    link_url: $('m-link').value.trim(),
    link_label: $('m-link-label').value.trim(),
    show_on_card: $('m-oncard').checked,
  };

  // Calcule les dates AVANT toute écriture
  let dates;
  if(rule==='none'){ dates=[$('m-date').value]; }
  else {
    dates=computeOccurrences($('m-date').value, rule, selectedOrdinals(), parseInt($('m-horizon').value));
    if(!dates.length){ showToast('Aucune occurrence — vérifie les réglages'); return; }
  }

  saving=true;
  const btn=$('m-save'); btn.disabled=true; const oldTxt=btn.textContent; btn.textContent='…';
  closeModal();                                       // ferme tout de suite → plus de double-clic
  try {
    const series_id = (rule!=='none')
      ? ((window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('s'+Date.now()))
      : null;
    let ok=0;
    for(const dt of dates){
      const body = rule==='none'
        ? {...base, id:id||undefined, date:dt, end_date:endDate}
        : {...base, date:dt, end_date:null, series_id};
      const r=await fetch('/api/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      if(r.ok){ const d=await r.json().catch(()=>({})); if(d.ok!==false) ok++; }
    }
    showToast(dates.length>1 ? `${ok} occurrences créées` : (ok?'Event enregistré':'Échec de la création'));
  } finally {
    saving=false; btn.disabled=false; btn.textContent=oldTxt;
    await loadAll();
  }
}

async function deleteEvent(id){
  if(!id) return;
  if(!confirm('Supprimer cet event et ses tâches ?')) return;
  await deleteIds([id]);
}
async function deleteSeries(id){
  const ev=events.find(x=>x.id===id); if(!ev) return;
  const sibs = ev.series_id ? events.filter(e=>e.series_id===ev.series_id) : [ev];
  if(!confirm(`Supprimer TOUTE la série — ${sibs.length} occurrences ?`)) return;
  await deleteIds(sibs.map(e=>e.id));
}
async function deleteIds(ids){
  let ok=0;
  for(const i of ids){ const r=await fetch('/api/events/'+i,{method:'DELETE'}); if(r.ok) ok++; }
  closeModal();
  showToast(ids.length>1 ? `${ok}/${ids.length} supprimés` : (ok?'Event supprimé':'Échec suppression'));
  await loadAll();
}

// ── Drawer détail ────────────────────────────────────────────────────────────
/**
 * ⚠️ IL NE RESTE PLUS QU'UNE COUCHE. Cette fonction ouvrait un tiroir de LECTURE, depuis lequel
 * « Éditer » fermait le tiroir puis ouvrait la fenêtre — et le voile restait posé entre les deux.
 * On clique un événement pour le modifier : autant y aller directement.
 */
function openDrawer(id){
  const e=events.find(x=>x.id===id);
  if(!e){
    /* ⚠️ UN ÉVÉNEMENT INTROUVABLE NE SE TAIT PAS. Le `return` muet d'avant laissait un clic sans
       effet — indistinguable d'une page bloquée, ce qui est précisément la confusion qu'on répare. */
    signalerPanne('Cet événement n\'est plus dans la liste chargée — rechargez la page.', '', 0);
    return;
  }
  openModal(e);
}


function renderTasks(e){
  const t=(tasksByEvent[e.id]||[]).slice().sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
  const done=t.filter(x=>x.done).length;
  $('d-progress').textContent = t.length?`${done}/${t.length}`:'';
  $('d-tasks').innerHTML = t.length ? t.map(x=>`
    <div class="task${x.done?' done':''}">
      <input type="checkbox" ${x.done?'checked':''} data-task="${x.id}">
      <span class="tlabel">${esc(x.label)}</span>
      <button class="tdel" data-taskdel="${x.id}">✕</button>
    </div>`).join('') : '<div class="empty-mini">Aucune tâche.</div>';
}

async function addTask(){
  const inp=$('d-task-input'); const label=inp.value.trim(); if(!label||!selectedId) return;
  const n=(tasksByEvent[selectedId]||[]).length;
  const r=await fetch('/api/events/tasks',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({event_id:selectedId,label,sort_order:(n+1)*10})});
  if(!r.ok){ showToast('Échec ajout tâche'); return; }
  inp.value=''; await reloadTasks();
}
async function toggleTask(id,done){
  await fetch('/api/events/tasks/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({done,done_at:done?new Date().toISOString():null})});
  await reloadTasks();
}
async function delTask(id){
  await fetch('/api/events/tasks/'+id,{method:'DELETE'});
  await reloadTasks();
}
async function reloadTasks(){
  const tr=await fetch('/api/events/tasks'); const tasks=tr.ok?await tr.json():[];
  tasksByEvent={}; tasks.forEach(t=>(tasksByEvent[t.event_id]=tasksByEvent[t.event_id]||[]).push(t));
  const e=events.find(x=>x.id===selectedId); if(e) renderTasks(e);
  if(view==='list') renderList();
}

// Notes stockées en jsonb sur l'event ({ts,text}), ajoutées au fil de l'eau.
function renderNotes(e){
  const notes=Array.isArray(e.notes)?e.notes:[];
  $('d-notes').innerHTML = notes.length ? notes.slice().reverse().map(n=>`
    <div class="note"><div class="ntext">${esc(n.text)}</div><div class="nts">${fmtNoteTs(n.ts)}</div></div>`).join('')
    : '<div class="empty-mini">Aucune note.</div>';
}
function fmtNoteTs(ts){ try{ const d=new Date(ts); return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } }
async function addNote(){
  const inp=$('d-note-input'); const text=inp.value.trim(); if(!text||!selectedId) return;
  const e=events.find(x=>x.id===selectedId); if(!e) return;
  const notes=Array.isArray(e.notes)?e.notes.slice():[];
  notes.push({ts:new Date().toISOString(),text});
  const r=await fetch('/api/events/'+selectedId,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({notes})});
  if(!r.ok){ showToast('Échec ajout note'); return; }
  e.notes=notes; inp.value=''; renderNotes(e);
}

// ── Overlay helpers ──────────────────────────────────────────────────────────
function overlayOn(){ $('overlay').classList.add('show'); }
/**
 * ⚠️ « MAYBE » A DISPARU, ET C'ÉTAIT LE PIÈGE. L'ancienne version n'éteignait le voile que si NI le
 * tiroir NI la fenêtre n'étaient ouverts — donc si l'un des deux gardait sa classe par accident, le
 * voile restait posé avec `pointer-events:auto` et plus rien n'était cliquable. Avec une seule
 * couche, il n'y a plus de condition : on ferme, donc on éteint.
 */
function overlayOff(){ $('overlay').classList.remove('show'); }

// ── Écouteurs ────────────────────────────────────────────────────────────────
$('prev').onclick = ()=>{ cur.setMonth(cur.getMonth()-1); render(); };
$('next').onclick = ()=>{ cur.setMonth(cur.getMonth()+1); render(); };
$('today-btn').onclick = ()=>{ cur=new Date(); cur.setDate(1); render(); };
$('v-cal').onclick = ()=>{ view='cal'; render(); };
$('v-list').onclick = ()=>{ view='list'; render(); };
$('new-btn').onclick = ()=> openModal(null);
$('m-cancel').onclick = closeModal;
$('m-save').onclick = saveEvent;
$('m-delete').onclick = ()=> deleteEvent($('m-id').value);
/* ⚠️ `d-close`, `d-edit` ET `d-delete` ONT DISPARU AVEC LE TIROIR. La croix est celle de la
   fenêtre (`m-cancel`), l'édition est l'ouverture elle-même, et la suppression est `m-delete` —
   qui existait déjà. Trois boutons en double, c'est trois occasions que l'un des deux cesse de
   faire la même chose que l'autre. */
$('d-delete-series').onclick = ()=>{ if(selectedId) deleteSeries(selectedId); };
$('d-task-add').onclick = addTask;
$('d-task-input').addEventListener('keydown',e=>{ if(e.key==='Enter') addTask(); });
$('d-note-add').onclick = addNote;
$('d-note-input').addEventListener('keydown',e=>{ if(e.key==='Enter') addNote(); });
/* ⚠️ Une seule couche à fermer : le voile n'a plus à deviner laquelle. */
$('overlay').onclick = closeModal;

$('m-swatches').addEventListener('click',e=>{
  const s=e.target.closest('.swatch'); if(!s) return;
  modalColor=s.dataset.c; buildSwatches();
});
// Récurrence : maj de l'aperçu au changement de règle / date / horizon / occurrences
$('m-recur').addEventListener('change',()=>{ currentRecurState(); updateRecurPreview(); });
$('m-date').addEventListener('change',()=>{ currentRecurState(); updateRecurPreview(); });
$('m-horizon').addEventListener('change', updateRecurPreview);
$('m-nth-wrap').addEventListener('change', updateRecurPreview);
// Calendrier : clic cellule = créer ; clic chip = ouvrir détail
$('cal-grid').addEventListener('click',e=>{
  const chip=e.target.closest('[data-ev]');
  if(chip){ e.stopPropagation(); openDrawer(chip.dataset.ev); return; }
  const cell=e.target.closest('[data-day]');
  if(cell) openModal(null, cell.dataset.day);
});
// Liste : clic carte = ouvrir détail
$('list-wrap').addEventListener('click',e=>{
  const c=e.target.closest('[data-ev]'); if(c) openDrawer(c.dataset.ev);
});
// Drawer : cases à cocher + suppression tâche
$('d-tasks').addEventListener('change',e=>{
  const cb=e.target.closest('[data-task]'); if(cb) toggleTask(cb.dataset.task, cb.checked);
});
$('d-tasks').addEventListener('click',e=>{
  const del=e.target.closest('[data-taskdel]'); if(del) delTask(del.dataset.taskdel);
});
/* ⚠️ ÉCHAP FERMAIT LES DEUX COUCHES ; il n'en reste qu'une. Un appel à `closeDrawer` laissé ici
   aurait levé à CHAQUE appui sur Échap — sur la touche dont on se sert précisément quand on veut
   sortir d'un écran bloqué. */
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

loadAll();
</script>
{% include "_pied.html" %}
</body>
</html>
