<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/static/icons/favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Estudantina">
<meta name="theme-color" content="#EDEAE3">
<title>Estudantina · Holidays</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css?v={{ v }}">
<style>
@media (max-width:760px) {

  .table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .table-wrap table { min-width:520px; }
  .modal { padding:20px; }
  .modal-grid { grid-template-columns:1fr; }
}

.section-title { font-size:15px; font-weight:700; margin:32px 0 12px; }
.section-title:first-of-type { margin-top:0; }
.section-sub { font-size:12px; color:var(--muted); margin:-8px 0 16px; }

.toolbar { display:flex; gap:10px; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; }
.btn-add { font-family:inherit; font-size:12px; font-weight:500; padding:7px 14px;
  border-radius:6px; cursor:pointer; border:1px solid var(--border); background:var(--bg-card); color:var(--text); }
.btn-add:hover { background:var(--bg-hover); }
.btn-primary { font-family:inherit; font-size:12px; font-weight:600; padding:8px 16px;
  border-radius:6px; cursor:pointer; border:none; background:var(--text); color:#fff; }
.btn-ghost { font-family:inherit; font-size:12px; padding:6px 12px; border-radius:6px;
  cursor:pointer; border:1px solid var(--border); background:transparent; color:var(--muted); }
.btn-danger { font-family:inherit; font-size:12px; padding:5px 10px; border-radius:6px; cursor:pointer;
  border:1px solid transparent; background:transparent; color:var(--red); }
.btn-danger:hover { background:rgba(196,85,77,.07); }

.table-wrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; margin-bottom:12px; }
table { width:100%; border-collapse:collapse; }
th { font-size:10px; font-weight:600; letter-spacing:.07em; text-transform:uppercase;
  color:var(--muted); padding:10px 14px; background:var(--bg-page);
  border-bottom:1px solid var(--border); text-align:left; }
td { font-size:13px; padding:9px 14px; border-bottom:1px solid var(--border); color:var(--text); vertical-align:middle; }
tr:last-child td { border-bottom:none; }
tr:hover td { background:var(--bg-hover); }
td.date { color:var(--muted); white-space:nowrap; }
.empty { text-align:center; color:var(--muted); padding:32px; font-size:13px; }

.badge { font-size:10px; font-weight:500; padding:2px 8px; border-radius:10px; display:inline-block; white-space:nowrap; }
.badge-holiday { background:#fce4ec; color:#880e4f; }
.badge-leave   { background:#e3f2fd; color:#1565c0; }

.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.35); display:none;
  align-items:center; justify-content:center; z-index:100; }
.modal-overlay.open { display:flex; }
.modal { background:var(--bg-card); border-radius:12px; padding:28px; width:440px; max-width:95vw; }
.modal-title { font-size:16px; font-weight:700; margin-bottom:18px; }
.modal-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.modal-grid .full { grid-column:1/-1; }
.field-label { font-size:11px; font-weight:500; color:var(--muted); margin-bottom:5px; display:block; }
.field-input { font-family:inherit; font-size:13px; padding:8px 10px; border:1px solid var(--border);
  border-radius:6px; background:var(--bg-card); color:var(--text); width:100%; box-sizing:border-box; }
.modal-foot { display:flex; gap:8px; margin-top:20px; }

.toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(80px);
  background:var(--text); color:#fff; padding:10px 18px; border-radius:8px; font-size:13px;
  opacity:0; transition:all .25s; z-index:200; }
.toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
</style>
</head>
<body>
{% include "_rail.html" %}
<div class="page">

  <div class="header">
    <div>
      <div class="header-title">Holidays &amp; staff leave</div>
      <div class="header-sub">Public holidays and per-employee time off</div>
    </div>
  </div>

  <div class="section-title">Public holidays</div>
  <div class="section-sub">Applies to the whole business — no employee selected.</div>
  <div class="toolbar">
    <span></span>
    <button class="btn-add" onclick="openModal('holiday')">+ Add holiday</button>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Date</th><th>Label</th><th style="width:60px;"></th></tr></thead>
      <tbody id="tbody-holidays"><tr><td colspan="3" class="empty">Loading…</td></tr></tbody>
    </table>
  </div>

  <div class="section-title">Staff leave</div>
  <div class="section-sub">Vacation / sick days per employee.</div>
  <div class="toolbar">
    <span></span>
    <button class="btn-add" onclick="openModal('leave')">+ Add leave</button>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Employee</th><th>From</th><th>To</th><th>Note</th><th style="width:60px;"></th></tr></thead>
      <tbody id="tbody-leave"><tr><td colspan="5" class="empty">Loading…</td></tr></tbody>
    </table>
  </div>

</div><!-- /page -->

<!-- Modal -->
<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-title" id="modal-title">Add holiday</div>
    <input type="hidden" id="f-id">
    <input type="hidden" id="f-type">
    <div class="modal-grid">
      <div class="full" id="f-employee-wrap" style="display:none;">
        <label class="field-label">Employee *</label>
        <select class="field-input" id="f-employee"></select>
      </div>
      <div>
        <label class="field-label" id="f-date-from-label">Date *</label>
        <input class="field-input" id="f-date-from" type="date">
      </div>
      <div id="f-date-to-wrap" style="display:none;">
        <label class="field-label">To</label>
        <input class="field-input" id="f-date-to" type="date">
      </div>
      <div class="full">
        <label class="field-label">Label / note</label>
        <input class="field-input" id="f-label" placeholder="e.g. Natal, Congés été…">
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn-primary" style="flex:1;" onclick="saveRow()">Save</button>
      <button class="btn-ghost" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/static/ui.js?v={{ v }}"></script>
<script>
const fmtDate = iso => new Date(iso + 'T12:00:00').toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'short', year:'numeric' });

let timeOff = [];
let employees = [];

function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }

async function loadAll(){
  if (window.uiLoadStart) uiLoadStart();
  try {
    const [tR, eR] = await Promise.all([fetch('/api/time_off'), fetch('/api/employees')]);
    timeOff = (await tR.json()).filter(r => r.active !== false);
    employees = (await eR.json()).filter(e => e.active !== false);
    render();
  } catch(e) {
    showToast('Failed to load — check your connection');
  } finally {
    if (window.uiLoadEnd) uiLoadEnd();
  }
}

function render(){
  const holidays = timeOff.filter(r => !r.employee_id).sort((a,b) => a.date_from.localeCompare(b.date_from));
  const leave    = timeOff.filter(r => r.employee_id).sort((a,b) => a.date_from.localeCompare(b.date_from));

  document.getElementById('tbody-holidays').innerHTML = holidays.length ? holidays.map(r => `
    <tr>
      <td class="date">${fmtDate(r.date_from)}</td>
      <td>${r.label || ''}</td>
      <td><button class="btn-danger" onclick="deleteRow('${r.id}')">Delete</button></td>
    </tr>`).join('') : '<tr><td colspan="3" class="empty">No public holidays yet</td></tr>';

  document.getElementById('tbody-leave').innerHTML = leave.length ? leave.map(r => {
    const emp = employees.find(e => e.id === r.employee_id);
    return `
    <tr>
      <td>${emp ? emp.name : '<span style="color:var(--faint)">Former employee</span>'}</td>
      <td class="date">${fmtDate(r.date_from)}</td>
      <td class="date">${fmtDate(r.date_to)}</td>
      <td>${r.label || ''}</td>
      <td><button class="btn-danger" onclick="deleteRow('${r.id}')">Delete</button></td>
    </tr>`;
  }).join('') : '<tr><td colspan="5" class="empty">No leave recorded yet</td></tr>';
}

function openModal(type){
  document.getElementById('f-id').value = '';
  document.getElementById('f-type').value = type;
  document.getElementById('f-label').value = '';
  document.getElementById('f-date-from').value = '';
  document.getElementById('f-date-to').value = '';
  const isLeave = type === 'leave';
  document.getElementById('modal-title').textContent = isLeave ? 'Add leave' : 'Add holiday';
  document.getElementById('f-employee-wrap').style.display = isLeave ? 'block' : 'none';
  document.getElementById('f-date-to-wrap').style.display = isLeave ? 'block' : 'none';
  document.getElementById('f-date-from-label').textContent = isLeave ? 'From *' : 'Date *';
  if (isLeave){
    document.getElementById('f-employee').innerHTML = employees.map(e => `<option value="${e.id}">${e.name}</option>`).join('');
  }
  document.getElementById('modal').classList.add('open');
}

function closeModal(){ document.getElementById('modal').classList.remove('open'); }

async function saveRow(){
  const type = document.getElementById('f-type').value;
  const isLeave = type === 'leave';
  const dateFrom = document.getElementById('f-date-from').value;
  if (!dateFrom){ showToast('Date required'); return; }
  if (isLeave && !employees.length){ showToast('Add an employee first (Costs page)'); return; }
  const body = {
    date_from: dateFrom,
    date_to: isLeave ? (document.getElementById('f-date-to').value || dateFrom) : dateFrom,
    label: document.getElementById('f-label').value,
    employee_id: isLeave ? document.getElementById('f-employee').value : null,
  };
  const r = await fetch('/api/time_off', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
  const d = await r.json();
  if (!d.ok){ showToast(d.error || 'Error'); return; }
  closeModal();
  showToast('Saved');
  loadAll();
}

async function deleteRow(id){
  if (!confirm('Delete this entry?')) return;
  await fetch(`/api/time_off/${id}`, { method:'DELETE' });
  showToast('Deleted');
  loadAll();
}

loadAll();
</script>
{% include "_pied.html" %}
</body>
</html>
